<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>阶段 4 · 前置修复 · 肩部遮挡片</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#EEF3F8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2C3542}
  .wrap{max-width:600px;margin:0 auto;padding:24px 20px 48px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:12.5px;line-height:1.8;color:#6B7684;margin:0 0 14px}
  .card{background:#fff;border-radius:18px;padding:8px;box-shadow:0 10px 26px rgba(30,45,61,.12)}
  .stage{position:relative;height:320px;border-radius:14px;overflow:hidden}
  svg.pet{width:100%;height:100%;display:block}
  /* ---------- 骨骼关节（完整保留 stage2） ---------- */
  svg.pet .torso      { transform-box: view-box; transform-origin: var(--hip-x) var(--hip-y); }
  svg.pet .head       { transform-box: view-box; transform-origin: var(--neck-x) var(--neck-y); }
  svg.pet .tail       { transform-box: view-box; transform-origin: var(--tail-x) var(--tail-y); }
  svg.pet .ear-l      { transform-box: view-box; transform-origin: var(--ear-l-x) var(--ear-l-y); }
  svg.pet .ear-r      { transform-box: view-box; transform-origin: var(--ear-r-x) var(--ear-r-y); }
  svg.pet .foreleg-l  { transform-box: view-box; transform-origin: var(--arm-x) var(--arm-y); }
  svg.pet .foreleg-r  { transform-box: view-box; transform-origin: var(--arm-r-x) var(--arm-r-y); }
  svg.pet .hindleg-l  { transform-box: view-box; transform-origin: var(--hindleg-l-x) var(--hindleg-l-y); }
  svg.pet .hindleg-r  { transform-box: view-box; transform-origin: var(--hindleg-r-x) var(--hindleg-r-y); }
  svg.pet .eyes,
  svg.pet .eye-open,
  svg.pet .eye-lid { transform-box: view-box; transform-origin: 100px 74px; }
  /* ---------- 阶段 3 · 四件待机动画 ---------- */
  /* 铁律：transform-only，全程不动 d/cx/cy/x/y/width/height */
  /* 呼吸缓动 cubic-bezier(0.4,0,0.2,1) 在 0/50/100 三段每段都是 ease 开头+结尾，
     端点速度=0 → 一鼓一鼓的感觉。参照成品 breathe 用 ease-in-out，
     两端平滑衔接，周期折返无顿感。 */
  svg.pet .torso {
    animation: breathe-torso 2.4s ease-in-out infinite;
  }
  svg.pet .head {
    /* 阶段 4：头部轻摆 ±6°，颈关节 (100,100) 为原点
       缓动 ease-in-out —— 循环待机动画统一用它，回弹留给交互一次性
       峰值角度声明 ±6°（不是缓动偷偷加出来的） */
    animation: nod-head 3.2s ease-in-out infinite;
    animation-delay: -1.6s;   /* 相位错开，不与呼吸同步 */
  }
  svg.pet .tail {
    /* 阶段 3·第3项：尾巴摆动 —— 在 rig 层（不跟随呼吸），关节 (138,150)
       幅度 -3.5°/+4.5°（参照成品待机 sway 8°，占开心幅度 38%）
       不对称偏右（猫尾自然上翘），周期 2.0s，delay -1.0s 错开 head/torso */
    animation: tail-sway 2.0s ease-in-out infinite;
    animation-delay: -1.0s;
  }
  svg.pet .eye-open {
    /* 阶段 3·第4项：眨眼 —— 睁眼层：scaleY 1 → 0.35 → 0（闭眼时完全让位给弧线） */
    animation: blink-open 5.2s ease-in-out infinite;
  }
  svg.pet .eye-lid {
    /* 闭眼弧层：睁眼时 scale(0) 塌成零点不可见；闭眼时 scale(1) 画出弧形眼线
       避免"把眼睛压扁"时只剩眼白高光变成一条白线 */
    animation: blink-lid 5.2s ease-in-out infinite;
  }
  /* 阶段 3 明确不动：ear / foreleg / hindleg —— 全部静止 */
  @keyframes breathe-torso {
    0%   { transform: scaleY(0.97); }
    50%  { transform: scaleY(1.03); }
    100% { transform: scaleY(0.97); }
  }
  @keyframes nod-head {
    /* 对称摆头：0→-6°→+6°→-6°→0，每段 ease-in-out 平滑过渡 */
    0%     { transform: rotate(-6deg); }
    25%    { transform: rotate(0deg); }
    50%    { transform: rotate(6deg); }
    75%    { transform: rotate(0deg); }
    100%   { transform: rotate(-6deg); }
  }
  @keyframes tail-sway {
    /* 尾巴摆动：不对称 -3.5°→4.5°→-3.5°（待机幅度 8°，开心时放大到 21°）
       保持不对称偏右 +0.5°（猫尾自然上翘） */
    0%     { transform: rotate(-3.5deg); }
    50%    { transform: rotate(4.5deg); }
    100%   { transform: rotate(-3.5deg); }
  }
  @keyframes blink-open {
    /* 睁眼层：闭合时直接缩到 0，让位给闭眼弧，避免残留眼白高光白线
       两次眨眼：84%→87.6% / 90%→93.6%，单次 3.6%×5200 = 187ms（Q 版慢眨更可爱） */
    0%, 84%  { transform: scaleY(1); }
    85%      { transform: scaleY(.35); }
    86.6%    { transform: scaleY(0); }
    87.6%    { transform: scaleY(1); }
    90%      { transform: scaleY(1); }
    91%      { transform: scaleY(.35); }
    92.6%    { transform: scaleY(0); }
    93.6%    { transform: scaleY(1); }
    100%     { transform: scaleY(1); }
  }
  @keyframes blink-lid {
    /* 闭眼弧层：与 blink-open 同一时间轨道，scale(0)→scale(1)→scale(0)
       scale(0) 塌成零点（不是压成直线），所以睁眼时完全看不见 */
    0%, 84%  { transform: scale(0); }
    85%      { transform: scale(1); }
    86.6%    { transform: scale(1); }
    87.6%    { transform: scale(0); }
    90%      { transform: scale(0); }
    91%      { transform: scale(1); }
    92.6%    { transform: scale(1); }
    93.6%    { transform: scale(0); }
    100%     { transform: scale(0); }
  }
  .joint-dot{pointer-events:none}
  .dot-r{fill:#E74C3C}.dot-o{fill:#F39C12}.dot-b{fill:#2C7BE5}
  .dot-g{fill:#27AE60}.dot-p{fill:#8E44AD}.dot-k{fill:#1B2A38}
  .joint-label{font-size:6.5px;fill:#1B2A38;opacity:.75}
  #report{background:#fff;border-radius:14px;padding:14px 16px;margin-top:14px;
          font-size:12.5px;line-height:1.85;color:#33404F;box-shadow:0 4px 14px rgba(30,45,61,.06);
          white-space:pre-wrap;font-family:Consolas,monospace}
  .ok{color:#1E8E4E;font-weight:700}
  .bad{color:#C0392B;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>阶段 4 · 前置修复 · 肩部遮挡片</h1>
  <p class="sub">
    <b>只加一片 fur 色肩部遮挡</b>，不动任何已定格数值：底边贴着手臂肩帽上缘（同一条贝塞尔，控制点 82,88.72），不压手臂上半段。<br>
    顶点 x73.5~89 / y82~96 在头 0° 时全部落在头圆内 → 被头完全盖住，不产生可见色斑。<br>
    挂在 torso 内、DOM 顺序在 foreleg 之后 head 之前：不随 head 转，只负责补 ±13° 掀开的那条薄楔形。<br>
    待机四件套（呼吸 / 头摆 / 尾巴 / 眨眼）与 stage6 完全一致，未改一行数值。
  </p>
  <div class="card pet-card cat">
    <div class="stage"><div id="mount"></div></div>
  </div>
  <pre id="report">测量中…</pre>
</div>

<script src="pet-measure.js"></script>
<script>
/* 阶段 4 代码 = stage3 完整 SVG + CSS 只换了两处：
   ① breathe-torso 的缓动从 cubic-bezier(0.4,0,0.2,1) → ease-in-out
   ② 新增 .head 的 animation: nod-head 3.2s ease-in-out infinite */
const mirror = s => `<g transform="translate(200,0) scale(-1,1)">${s}</g>`;
const armPath = (sx,sy, ex,ey, wx,wy, w1,w2) =>
  `M${sx-w1/2},${sy} Q${ex-w1*0.62},${ey} ${wx-w2/2},${wy} `+
  `Q${wx},${wy+w2*0.80} ${wx+w2/2},${wy} Q${ex+w1*0.46},${ey} ${sx+w1/2},${sy} `+
  `Q${sx},${sy-w1*0.52} ${sx-w1/2},${sy} Z`;
const armAt = (sx,sy,ex,ey,wx,wy,w1,w2) =>
  `<path data-w1="${w1}" data-w2="${w2}" data-sx="${sx}" data-sy="${sy}" data-part="forearm" `+
  `d="${armPath(sx,sy,ex,ey,wx,wy,w1,w2)}" fill="var(--limb)" stroke="var(--outline)" stroke-width="2" stroke-linejoin="round"/>`+
  `<path d="M${sx-w1/2+2.6},${sy+9} Q${ex-w1*0.48},${ey} ${wx-w2/2+2},${wy-5}" fill="none" `+
  `stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".2"/>`;
const hindFoot = (cx, cy, halfW, halfH) =>
  `<ellipse cx="${cx}" cy="${cy}" rx="${halfW}" ry="${halfH}" fill="var(--foot)" stroke="var(--outline)" stroke-width="2"/>`+
  `<circle cx="${cx-5}" cy="${cy-3}" r="2.2" fill="var(--foot)" stroke="var(--outline)" stroke-width="1.1"/>`+
  `<circle cx="${cx}" cy="${cy-4}" r="2.2" fill="var(--foot)" stroke="var(--outline)" stroke-width="1.1"/>`+
  `<circle cx="${cx+5}" cy="${cy-3}" r="2.1" fill="var(--foot)" stroke="var(--outline)" stroke-width="1.1"/>`+
  `<ellipse cx="${cx}" cy="${cy+1.5}" rx="6" ry="3.6" fill="var(--pink)" opacity=".6"/>`;

const CAT = {
  key:'cat', name:'猫', emoji:'🐱',
  vars:{
    '--fur':'#B9C0C9','--fur-dark':'#8E97A3','--fur-light':'#DCE1E7','--belly':'#F7F9FB',
    '--pink':'#FF9AA8','--ink':'#3B2A20','--foot':'#E8ECF1','--limb':'#CFD5DC',
    '--outline':'#55606E',
    '--hip-x':'100px','--hip-y':'176px',
    '--neck-x':'100px','--neck-y':'100px',
    '--tail-x':'138px','--tail-y':'150px',
    '--ear-l-x':'74px','--ear-l-y':'54px',
    '--ear-r-x':'126px','--ear-r-y':'54px',
    '--arm-x':'82px','--arm-y':'96px',
    '--arm-r-x':'118px','--arm-r-y':'96px',
    '--hindleg-l-x':'66px','--hindleg-l-y':'146px',
    '--hindleg-r-x':'134px','--hindleg-r-y':'146px'
  },
  tail:
    '<path d="M138,150 C158,157 176,143 172,123 C169,109 155,107 150,117" fill="none" '+
    'stroke="var(--fur-dark)" stroke-width="15" stroke-linecap="round"/>'+
    '<path d="M139,150 C155,155 168,144 166,130" fill="none" stroke="var(--fur-light)" stroke-width="4" stroke-linecap="round" opacity=".55"/>',
  arm: armAt(82,96, 70,128, 80,165, 14,10),
  paw:
    '<ellipse cx="80" cy="170" rx="8.5" ry="6.8" fill="var(--limb)" stroke="var(--outline)" stroke-width="2"/>'+
    '<circle cx="72" cy="167" r="2.7" fill="var(--limb)" stroke="var(--outline)" stroke-width="1.3"/>'+
    '<circle cx="80" cy="166" r="2.7" fill="var(--limb)" stroke="var(--outline)" stroke-width="1.3"/>'+
    '<circle cx="88" cy="167" r="2.6" fill="var(--limb)" stroke="var(--outline)" stroke-width="1.3"/>'+
    '<ellipse cx="80" cy="172.5" rx="5" ry="3.4" fill="var(--pink)" opacity=".65"/>',
  /* 肩部遮挡片：fur 色小楔形，只补「头转开后露出的肩顶」这一块
     底边严格贴在手臂肩帽的上缘（同一条二次贝塞尔，控制点 82,88.72），
     所以不压住手臂上半段；顶点范围 x73.5~89 / y82~96
     头在 0° 时这些点全部落在头圆 (100,74,r34) 内 → 完全被头盖住，不产生色斑 */
  shoulder:
    '<path data-part="shoulder" d="M74.3,96 Q82,88.72 89,96 L89,82 L73.5,82 Z" fill="var(--fur)"/>'+
    mirror('<path data-part="shoulder" d="M74.3,96 Q82,88.72 89,96 L89,82 L73.5,82 Z" fill="var(--fur)"/>'),
  body:
    '<path data-part="body" d="M100,88 C123,88 136,113 137,141 C137,164 121,175 100,175 C79,175 63,164 63,141 C64,113 77,88 100,88 Z" fill="var(--fur)"/>'+
    '<path d="M71,118 l7,-4 M69,130 l8,-3 M72,142 l7,-3" stroke="var(--fur-dark)" stroke-width="4.5" stroke-linecap="round" opacity=".5"/>'+
    '<path d="M129,118 l-7,-4 M131,130 l-8,-3 M128,142 l-7,-3" stroke="var(--fur-dark)" stroke-width="4.5" stroke-linecap="round" opacity=".5"/>',
  belly:'<ellipse data-part="belly" cx="100" cy="146" rx="19" ry="19" fill="var(--belly)"/>',
  hindL:'<ellipse data-part="hindleg-l" cx="66" cy="146" rx="11.5" ry="21" fill="var(--fur-dark)" stroke="var(--outline)" stroke-width="2"/>',
  hindR: mirror('<ellipse data-part="hindleg-r" cx="66" cy="146" rx="11.5" ry="21" fill="var(--fur-dark)" stroke="var(--outline)" stroke-width="2"/>'),
  hindFeet: hindFoot(66,169, 10.5,6.5) + hindFoot(134,169, 10.5,6.5),
  earL:
    '<path d="M74,54 C66,40 62,26 63,18 C73,27 84,34 92,41 Z" fill="var(--fur)"/>'+
    '<path d="M76,50 C70,38 67,29 68,24 C74,30 81,35 87,40 Z" fill="var(--pink)" opacity=".9"/>',
  head:
    '<circle cx="100" cy="74" r="34" fill="var(--fur)"/>'+
    '<ellipse cx="86" cy="60" rx="12" ry="7" fill="#fff" opacity=".16" transform="rotate(-18 86 60)"/>'+
    '<path d="M94,45l2,11M100,43v12M106,45l-2,11" stroke="var(--fur-dark)" stroke-width="3" stroke-linecap="round"/>'+
    '<ellipse cx="72" cy="88" rx="8" ry="5" fill="var(--pink)" opacity=".5"/>'+
    '<ellipse cx="128" cy="88" rx="8" ry="5" fill="var(--pink)" opacity=".5"/>'+
    '<path d="M96,87 Q100,84 104,87 Q100,93 96,87 Z" fill="#E8737A"/>'+
    '<path d="M100,93 Q95,99 90,95 M100,93 Q105,99 110,95" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>'+
    '<path d="M68,84 L46,78 M68,90 L48,91 M132,84 L154,78 M132,90 L152,91" stroke="var(--fur-light)" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>',
  eyes:
    '<g class="eye-open">'+
      '<ellipse cx="86" cy="74" rx="6" ry="7.5" fill="var(--ink)"/>'+
      '<circle cx="84" cy="71" r="2.2" fill="#fff"/>'+
      '<ellipse cx="114" cy="74" rx="6" ry="7.5" fill="var(--ink)"/>'+
      '<circle cx="112" cy="71" r="2.2" fill="#fff"/>'+
    '</g>'+
    /* 闭眼弧：睁眼时 scale(0) 塌成零点（不可见），闭眼时 scale(1)。
       单独一条弧线，避免把眼睛压扁时露出眼白高光变成"白线" */
    '<g class="eye-lid">'+
      '<path d="M80,74 Q86,70.5 92,74" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>'+
      '<path d="M108,74 Q114,70.5 120,74" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>'+
    '</g>'
};

function buildCat(p){
  const style = Object.entries(p.vars).map(([k,v])=>`${k}:${v}`).join(';');
  const forelegL = `<g class="foreleg foreleg-l" data-part="foreleg-l">${p.arm}${p.paw}</g>`;
  const forelegR = `<g class="foreleg foreleg-r" data-part="foreleg-r">${mirror(p.arm + p.paw)}</g>`;
  const earL = `<g class="ear ear-l" data-part="ear-l">${p.earL}</g>`;
  const earR = `<g class="ear ear-r" data-part="ear-r">${mirror(p.earL)}</g>`;
  const hindlegL = `<g class="hindleg hindleg-l" data-part="hindleg-l">${p.hindL}</g>`;
  const hindlegR = `<g class="hindleg hindleg-r" data-part="hindleg-r">${p.hindR}</g>`;
  return `<svg class="pet" viewBox="0 0 200 200" style="${style}" aria-label="猫">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87CEEB"/><stop offset=".55" stop-color="#B0E0A8"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EDC92"/><stop offset="1" stop-color="#7ED957"/></linearGradient>
    <radialGradient id="vig">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset=".62" stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <g class="scene">
    <rect width="200" height="200" fill="url(#sky)"/>
    <ellipse cx="46" cy="38" rx="17" ry="10" fill="#fff" opacity=".92"/>
    <ellipse cx="58" cy="34" rx="13" ry="12" fill="#fff" opacity=".92"/>
    <ellipse cx="36" cy="41" rx="11" ry="7" fill="#fff" opacity=".92"/>
    <path d="M0,140 Q50,110 100,130 Q150,145 200,125 L200,160 L0,160 Z" fill="#7BC87B" opacity=".5"/>
    <path d="M0,144 Q50,132 100,138 T200,134 L200,200 L0,200 Z" fill="url(#grass)"/>
    <path d="M4,176 H196" stroke="#4E9C5E" stroke-width="1" stroke-dasharray="4 4" opacity=".35"/>
    <ellipse cx="100" cy="116" rx="74" ry="82" fill="url(#vig)"/>
  </g>
  <ellipse class="shadow" cx="100" cy="176" rx="42" ry="9" fill="#1B2A38" opacity=".18"/>
  <g class="rig" data-part="root">
    <g class="tail" data-part="tail">${p.tail}</g>
    <g class="torso" data-part="torso">
      <g class="body-g">${p.body}</g>
      ${p.belly}
      ${hindlegL} ${hindlegR}
      ${p.hindFeet}
      ${forelegL} ${forelegR}
      ${p.shoulder}
      <g class="head" data-part="head">
        ${earL} ${earR}
        ${p.head}
        <g class="eyes" data-part="eyes">${p.eyes}</g>
      </g>
    </g>
  </g>
</svg>`;
}
document.getElementById('mount').innerHTML = buildCat(CAT);
const _svg = document.querySelector('svg.pet');
_svg.style.width = '100%'; _svg.style.height = '100%'; _svg.style.display = 'block';

/* ============================================================================
   ?freeze= 冻结开关（一次给全）
   pat13 / pat13neg / feed7 / clean / blinkclose / sit / stand / ly
   用途是「验证修复效果」，不是让肉眼判断有没有露——露出量由像素采样给出。
   sit / stand / ly 属三套姿态，本阶段文件尚未实现，probeReport 会报 N/A。
   ============================================================================ */
const FREEZE = new URLSearchParams(location.search).get('freeze');
const FREEZE_SEL = {
  head:'.head', root:'[data-part="root"]', 'eye-open':'.eye-open', 'eye-lid':'.eye-lid'
};
const FREEZE_STATES = {
  rest:       {},                 /* 0° 基线：只停动画，不做任何变换 */
  pat13:      { head:'rotate(13deg)' },
  pat13neg:   { head:'rotate(-13deg)' },
  feed7:      { head:'translateY(2px) rotate(7deg)' },
  clean:      { root:'rotate(6deg)' },
  blinkclose: { 'eye-open':'scaleY(0)', 'eye-lid':'scale(1)' },
  shoulder:   {},                 /* 三态扫描：rest / ±13° 由 shoulderSweep 内部依次施加 */
  sit:null, stand:null, ly:null
};
(function applyFreeze(){
  if (!FREEZE) return;
  const st = FREEZE_STATES[FREEZE];
  if (!st) return;
  /* 冻结时先停掉全部循环动画，保证像素采样是确定的一帧 */
  const style = document.createElement('style');
  style.textContent = 'svg.pet, svg.pet * { animation: none !important; transition: none !important; }';
  document.head.appendChild(style);
  Object.entries(st).forEach(([k,v])=>{
    const el = document.querySelector('svg.pet ' + FREEZE_SEL[k]);
    if (el) el.style.transform = v;
  });
})();

/* 红点层（复用 stage2） */
const NS = 'http://www.w3.org/2000/svg';
function parseOrigin(decl){
  if (!decl || decl === 'none' || decl.includes('center')) return [null,null];
  const m = decl.match(/(-?\d*\.?\d+)(?:px)?\s+(-?\d*\.?\d+)(?:px)?/);
  if (!m) return [null,null];
  return [+m[1], +m[2]];
}
const JOINT_TABLE = [
  { selector:'.torso',     label:'torso 呼吸',  color:'k', expect:[100,176] },
  { selector:'.head',      label:'head 颈关节', color:'b', expect:[100,100] },
  { selector:'.tail',      label:'tail 尾根',   color:'g', expect:[138,150] },

/* ============================================================================

   ③ 肩顶遮挡：head 摆到两端时，左前肩顶 (82,96) 距 head bbox 底部距离
   ④ 静止部件：tail/ear/foreleg/hindleg 仍然 animationName=none
   ⑤ getAnimations() 数量应恰好 2
   ============================================================================ */
function parseRotateDeg(tx){
  /* getComputedStyle.transform 返回 "matrix(0.9945, -0.1045, 0.1045, 0.9945, 0, 0)" 这种 */
  const m = (tx||'').match(/matrix\(([-\d.]+),\s*([-\d.]+),\s*([-\d.]+),\s*([-\d.]+)/);
  if (!m) return null;
  const a = +m[1], b = +m[2];
  return Math.round(Math.atan2(b,a)*180/Math.PI*100)/100;  /* 角度，两位小数 */
}
function parseScaleY(tx){
  const m = (tx||'').match(/matrix\(([-\d.]+),\s*([-\d.]+),\s*([-\d.]+),\s*([-\d.]+)/);
  if (!m) return null;
  return +m[4].toFixed(3);
}

/* 用基底时间确保 currentTime 始终在 delay 之后，动画效果始终应用中。
   否则 fill=none 时 delay 范围内 transform 返回 'none' 导致 matrix 解析失败。
   基底 = delay + N*duration（N=1000） + ratio*duration
   → 周期位置 = (base - delay) % duration = ratio * duration % duration = ratio ✓ */
function pauseAndJump(el, ratio){
  const anim = el.getAnimations()[0];
  if (!anim) return null;
  anim.pause();
  const t = anim.effect.getComputedTiming();
  const N = 1000;
  anim.currentTime = t.delay + (N + ratio) * t.duration;
  return anim;
}
/* 矩阵解析统一走共享模块（内含科学计数法 fixture：5.55112e-17 必须读成 0.00） */
function readTransform(el){ return PM.readTransform(el); }
function readBBox(el){
  /* getBBox 读的是 transform 作用后的 bbox（SVG 坐标系内） */
  const b = el.getBBox();
  return { x:b.x, y:b.y, w:b.width, h:b.height, bottomY: b.y+b.height, cx: b.x+b.width/2 };
}

    lines.push(`  数量 ${shoulderEls.length}（左 + 右）；DOM 在 foreleg 之后=${afterArm}，在 head 之前=${beforeHead}`);
    lines.push(afterArm && beforeHead
      ? `<span class="ok">✓ 顺序正确：被手臂压住、盖住手臂肩帽上缘，且在 head 之下——head 转它不转</span>`
      : `<span class="bad">⚠ DOM 顺序不对，遮挡片会跟着 head 转或盖住手臂</span>`);
  } else {
    lines.push(`<span class="bad">⚠ 遮挡片缺失或数量=${shoulderEls.length}</span>`);
  }
  lines.push('');

  document.getElementById('report').innerHTML = lines.join('\n');
  } catch(err){
    document.getElementById('report').innerHTML = '❌ 脚本报错: ' + err.message + '\n\n' + err.stack;
    console.error('measureAndReport error:', err);
  }
}
/* ============================================================================
   冻结探针：不做视觉判断，直接取像素。
   截图不可用 ≠ 取像素不可用：SVG 序列化 → data URL → canvas → getImageData。
   alpha < 40 视为「该点没有被任何部件绘制」= 直接看到背景 = 穿帮。
   ============================================================================ */
async function probeReport(fix){
  const svg = document.querySelector('svg.pet');
  const lines = [];
  lines.push('── 测量工具 fixture 自检（已知答案）──');
  (fix.results || []).forEach(r=>{
    lines.push(`  ${r.key}(${r.tx.slice(0,34)}…) = ${r.got==null?'null':r.got.toFixed(3)}（应 ${r.exp==null?'null':r.exp}）${r.ok?'✓':'✗'}`);
  });
  lines.push(fix.ok ? '<span class="ok">✓ fixture 全过，下面所有读数可信</span>'
                    : '<span class="bad">⛔ fixture 未过，拒绝报数</span>');
  lines.push('');

  if (FREEZE === 'shoulder') return shoulderSweep(fix, lines);

  lines.push(`── 冻结探针 ?freeze=${FREEZE} ──`);
  const st = FREEZE_STATES[FREEZE];
  if (!st) {
    lines.push(`Ⓝ freeze=${FREEZE} 在当前阶段文件里没有对应姿态（sit / stand / ly 属三套姿态，尚未实现）`);
    document.getElementById('report').innerHTML = lines.join('\n');
    return;
  }
  Object.keys(st).forEach(k=>{
    const el = document.querySelector('svg.pet ' + FREEZE_SEL[k]);
    lines.push(`  ${k} transform（getComputedStyle）= ${el ? getComputedStyle(el).transform : 'N/A'}`);
  });
  lines.push(`  渲染口径：viewBox 200 → canvas 400px（2×）；游戏页实际 CSS 尺寸 230px（assets/css/pet.css）`);
  lines.push('');

  const view = await renderSafe(svg, lines);
  if (!view) return;

  /* 参考色：躯干中心（已知是 fur） */
  const furPx = view.at(100, 120);
  const bgL = view.at(30, 96);
  const bgR = view.at(170, 96);
  lines.push(`参考像素 躯干(100,120) = rgba(${furPx.r},${furPx.g},${furPx.b},${furPx.a})`);
  lines.push(`背景参考 (30,96) = rgba(${bgL.r},${bgL.g},${bgL.b},${bgL.a}) / (170,96) = rgba(${bgR.r},${bgR.g},${bgR.b},${bgR.a})`);
  lines.push('');

  reportRegions(view, furPx, bgL, bgR, lines);

  if (FREEZE === 'blinkclose') {
    let white = 0;
    for (let y = 62; y <= 86; y += 0.5) {
      for (let x = 78; x <= 122; x += 0.5) {
        const p = view.at(x, y);
        if (p && p.a > 200 && p.r > 235 && p.g > 235 && p.b > 235) white++;
      }
    }
    lines.push(`眼部白像素（r/g/b>235 且 a>200，x78~122 / y62~86）：<span class="${white? 'bad':'ok'}">${white} 个</span>`);
  }

  document.getElementById('report').innerHTML = lines.join('\n');
}

function renderSafe(svg, lines){
  return PM.renderToCanvas(svg, 400).catch(e=>{
    lines.push(`<span class="bad">❌ 像素采样失败：${e.message}</span>`);
    document.getElementById('report').innerHTML = lines.join('\n');
    return null;
  });
}

/* 楔形区统计：背景色像素（穿帮判据）+ fur 像素（遮挡片是否接管）+ 主色 */
function reportRegions(view, furPx, bgL, bgR, lines){
  const regions = [
    ['左肩楔形', 72, 86, 86, 100, bgL],
    ['右肩楔形', 114, 86, 128, 100, bgR],
  ];
  regions.forEach(([label,x0,y0,x1,y1,bg])=>{
    const r = PM.countNear(view, x0, y0, x1, y1, bg, 10);
    const pct = r.count ? `，bbox x${r.bbox.x.toFixed(1)}~${(r.bbox.x+r.bbox.w).toFixed(1)} / y${r.bbox.y.toFixed(1)}~${(r.bbox.y+r.bbox.h).toFixed(1)}` : '';
    lines.push(`${label} x${x0}~${x1} / y${y0}~${y1}：<span class="${r.count? 'bad':'ok'}">背景色像素 ${r.count} 个${pct}</span>`);
    const fur = PM.countNear(view, x0, y0, x1, y1, furPx, 10).count;
    const tops = PM.topColors(view, x0, y0, x1, y1, 3);
    lines.push(`  fur 色像素 ${fur} 个；主色：${tops.map(t=>`rgba(${t.rgb})=${t.n}`).join(' / ')}`);
  });
  lines.push('');
}

/* 肩部遮挡片三态扫描：同一帧口径下，分别渲染「有遮挡片」与「无遮挡片」两张图做差分。
   这样能直接回答两个问题：
   ① 0° 时遮挡片有没有从头的剪影里探出来（探出 = 原本草地/手臂的像素被 fur 顶替）
   ② ±13° 时遮挡片有没有压到手臂上半段（压到 = 原本 limb 的像素被 fur 顶替） */
async function shoulderSweep(fix, lines){
  const svg = document.querySelector('svg.pet');
  const head = svg.querySelector('.head');
  const shEls = [...svg.querySelectorAll('.torso [data-part="shoulder"]')];
  lines.push('── 肩部遮挡片三态扫描（有/无遮挡片同帧差分）──');
  lines.push(`  遮挡片元素 ${shEls.length} 个（左 + 右镜像）；渲染口径 viewBox 200 → canvas 400px（2×）`);
  lines.push('');

  const states = [
    { name:'rest（head 0° 基线）',  tx:'' },
    { name:'pat13（head +13°）',    tx:'rotate(13deg)' },
    { name:'pat13neg（head -13°）', tx:'rotate(-13deg)' },
  ];
  const summary = [];
  for (const st of states){
    head.style.transform = st.tx;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const view = await renderSafe(svg, lines);
    if (!view) return;

    const prev = shEls.map(s=>s.style.display);
    shEls.forEach(s=>s.style.display='none');
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const ref = await renderSafe(svg, lines);
    shEls.forEach((s,i)=>s.style.display=prev[i]);
    if (!ref) return;

    const furPx = view.at(100, 120);
    const bgL = view.at(30, 96);
    const bgR = view.at(170, 96);
    lines.push(`【${st.name}】head transform=${getComputedStyle(head).transform}`);
    lines.push(`  参考 fur(100,120)=rgba(${furPx.r},${furPx.g},${furPx.b},${furPx.a}) / 草地(30,96)=rgba(${bgL.r},${bgL.g},${bgL.b},${bgL.a})`);
    const withCounts = [
      PM.countNear(view, 72, 86, 86, 100, bgL, 10).count,
      PM.countNear(view, 114, 86, 128, 100, bgR, 10).count,
    ];
    lines.push(`  背景色像素：左 ${withCounts[0]} / 右 ${withCounts[1]}`);

    /* 差分：只统计遮挡片可能影响的窗口 x68~132 / y80~100 */
    const near = (p,ref2,tol)=>p && Math.abs(p.r-ref2.r)<=tol && Math.abs(p.g-ref2.g)<=tol && Math.abs(p.b-ref2.b)<=tol;
    const limbRef = {r:207,g:213,b:220};
    let newFur = 0, overLimb = 0, diff = 0;
    for (let y = 80; y <= 100; y += 0.5){
      for (let x = 68; x <= 132; x += 0.5){
        const a = view.at(x, y), b = ref.at(x, y);
        if (!a || !b) continue;
        const d = Math.abs(a.r-b.r)+Math.abs(a.g-b.g)+Math.abs(a.b-b.b);
        if (d > 24) diff++;
        if (near(a,furPx,12) && !near(b,furPx,12) && (near(b,bgL,6) || near(b,bgR,6))) newFur++;
        if (near(a,furPx,12) && near(b,limbRef,12) && !near(a,limbRef,12)) overLimb++;
      }
    }
    const restOK = st.tx === '' && newFur === 0 && overLimb === 0;
    const hiddenOK = st.tx !== '' && withCounts[0] <= 1 && withCounts[1] <= 1;
    lines.push(`  遮挡片贡献：新增 fur ${newFur} 点 / 顶替 limb ${overLimb} 点 / 总差异 ${diff} 点`);
    lines.push(st.tx === ''
      ? (restOK ? `<span class="ok">✓ 0° 无可见色斑（遮挡片完全在头剪影内，未顶替任何草地/手臂像素）</span>`
                : `<span class="bad">⚠ 0° 有可见色斑：新增 fur ${newFur} / 顶替 limb ${overLimb}</span>`)
      : (hiddenOK ? `<span class="ok">✓ 掀开区已被 fur 填住（背景像素 ≤1，等同基线）</span>`
                  : `<span class="bad">⚠ 掀开区仍有背景像素 ${withCounts[0]}/${withCounts[1]}</span>`));
    summary.push({ name:st.name, newFur, overLimb, diff, left:withCounts[0], right:withCounts[1] });
    lines.push('');
  }

  document.getElementById('report').innerHTML = lines.join('\n');
}

setTimeout(measureAndReport, 600);
